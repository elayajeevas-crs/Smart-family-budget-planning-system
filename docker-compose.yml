services:
  postgres:
    image: postgres:16-alpine
    container_name: smart_family_budget_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: budget_user
      POSTGRES_PASSWORD: budget_password
      POSTGRES_DB: smart_family_budget
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget_user -d smart_family_budget"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
